org.gradle.caching=true
org.gradle.parallel=true
# Med 21 moduler kjører Gradle ellers like mange samtidige Kotlin-kompileringer som maskinen har
# kjerner, noe som sprenger minnet på maskiner med mange kjerner og lite ledig RAM. 4 workers
# holder toppforbruket rundt 7 GB, og tilsvarer det CI-runneren (4 vCPU) bruker uansett.
org.gradle.workers.max=4
