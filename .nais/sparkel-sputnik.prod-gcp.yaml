spec:
  replicas:
    min: 2
    max: 8
  kafka:
    pool: nav-prod
  azure:
    application:
      tenant: nav.no
  env:
    - name: ABAKUS_URL
      value: https://fpabakus.prod-fss-pub.nais.io/fpabakus/ekstern/api/ytelse/v1/hent-ytelse-vedtak
    - name: ABAKUS_SCOPE
      value: api://prod-fss.teamforeldrepenger.fpabakus/.default
  accessPolicy:
    outbound:
      external:
        - host: fpabakus.prod-fss-pub.nais.io
