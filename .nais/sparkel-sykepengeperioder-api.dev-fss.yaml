spec:
  ingresses:
    - https://sykepengeperioder-api.dev-fss-pub.nais.io
  replicas:
    min: 1
    max: 1
  azure:
    application:
      tenant: trygdeetaten.no
  vault:
    paths:
      - mountPath: /var/run/secrets/nais.io/oracle/creds
        kvPath: oracle/data/dev/creds/sp_infotrygd_q-user
      - mountPath: /var/run/secrets/nais.io/oracle/config
        kvPath: oracle/data/dev/config/infotrygd_spq
  env:
    - name: DATABASE_SCHEMA
      value: INFOTRYGD_SPQ
  accessPolicy:
    inbound:
      rules:
        - application: spesialist
          namespace: tbd
          cluster: dev-gcp
        - application: spokelse
          namespace: tbd
          cluster: dev-gcp
