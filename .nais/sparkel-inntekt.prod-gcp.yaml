spec:
  replicas:
    min: 2
    max: 8
  kafka:
    pool: nav-prod
  env:
    - name: INNTEKTSKOMPONENTEN_BASE_URL
      value: https://ikomp.prod-fss-pub.nais.io/rs
    - name: INNTEKTSKOMPONENTEN_OAUTH_SCOPE
      value: api://prod-fss.team-inntekt.ikomp/.default
  accessPolicy:
    outbound:
      external:
        - host: ikomp.prod-fss-pub.nais.io
