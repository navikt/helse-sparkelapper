spec:
  replicas:
    min: 1
    max: 1
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
  env:
    - name: REPR_API_SCOPE
      value: api://dev-gcp.repr.repr-api/.default
  accessPolicy:
    outbound:
      rules:
        - application: repr-api
          namespace: repr
          cluster: dev-gcp
