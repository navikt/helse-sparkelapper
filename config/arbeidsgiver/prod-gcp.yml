app: arbeidsgiver
kafkaPool: nav-prod
replicas:
  min: 1
  max: 1
azure:
  enabled: true
accessPolicy:
  outbound:
    rules:
      - application: spedisjon
        namespace: tbd
env:
  - name: KAFKA_EXTRA_TOPIC
    value: tbd.arbeidsgiveropplysninger
requests:
  cpu: 100m
  memory: 512Mi
limits:
  memory: 512Mi
